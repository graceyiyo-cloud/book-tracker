<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>閱讀手帳 · 手機版預覽</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#e9e7df;color:#303832;font-family:"Microsoft JhengHei",sans-serif}header{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:14px;padding:16px;font-size:14px}label{display:flex;align-items:center;gap:8px}select,a{font:inherit;border:1px solid #c9cdc2;border-radius:6px;background:#fffdfa;padding:9px 12px;color:#536a58}a{text-decoration:none}main{display:flex;justify-content:center;padding:0 16px 24px}.device{width:390px;max-width:100%;height:calc(100dvh - 92px);min-height:480px;border:1px solid #c3c7bc;border-radius:16px;overflow:hidden;box-shadow:0 10px 35px #30383218;background:#f6f3ed}iframe{width:100%;height:100%;border:0;display:block}small{color:#687068}@media(max-width:500px){header{padding:10px;gap:8px;font-size:12px}main{padding:0}.device{height:calc(100dvh - 66px);min-height:0;border:0;border-radius:0}small{display:none}}
</style></head><body>
<header><strong>手機版預覽</strong><label>寬度<select id="width" aria-label="選擇手機螢幕寬度"><option value="360">360 px</option><option value="390" selected>390 px</option><option value="430">430 px</option></select></label><a href="./?demo=1" target="_blank" rel="noopener">獨立開啟</a><small>示範資料，不影響正式書單</small></header>
<main><div class="device" id="device"><iframe title="閱讀手帳手機版" src="./?demo=1" allow="clipboard-write"></iframe></div></main>
<script>document.getElementById('width').addEventListener('change',e=>{document.getElementById('device').style.width=e.target.value+'px'});</script>
</body></html>
